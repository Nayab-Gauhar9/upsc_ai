name: PIB Ingestion Cron

on:
  schedule:
    # Runs every 3 hours (UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual 1-click execution

jobs:
  run-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PIB Ingestion
        env:
          PYTHONPATH: .
          STORAGE_TARGET: r2
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python -c "from src.pib_ingestion import run_pib_ingestion; report = run_pib_ingestion(limit=10); print('FINAL INGESTION REPORT:', report)"
